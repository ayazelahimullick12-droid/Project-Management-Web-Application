<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Management · Prototype</title>
    <script>
      // Apply dark mode before the page draws, so it doesn't flash white (see src/components/prefs.ts).
      try {
        var t = (JSON.parse(localStorage.getItem('brac-pm-prototype:prefs') || '{}').theme) || 'light'
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
